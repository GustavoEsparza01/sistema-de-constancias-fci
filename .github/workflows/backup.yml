name: Respaldo de base de datos

# Domingos a las 06:00 UTC (00:00 en Campeche, UTC-6), más ejecución manual
# desde la pestaña Actions.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  respaldo:
    name: pg_dump de Supabase
    runs-on: ubuntu-latest
    steps:
      # Se instala el cliente desde el repositorio oficial de PostgreSQL para
      # que la versión de pg_dump no quede por debajo de la del servidor de
      # Supabase (pg_dump se niega a volcar una base más nueva que él).
      - name: Instalar cliente de PostgreSQL
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p respaldo
          echo "FECHA=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --file "respaldo/constancias-fci-$(date -u +%Y-%m-%d).sql"

      - name: Subir respaldo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-constancias-fci-${{ env.FECHA }}
          path: respaldo/
          retention-days: 30
