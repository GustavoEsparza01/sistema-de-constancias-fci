name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # --if-present: no falla si algún día se quita el script de lint.
      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  api:
    name: API (instalación + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Todavía no hay pruebas en la API; cuando se agregue el script "test"
      # este paso empieza a correrlas sin tocar el workflow.
      - name: Pruebas
        run: npm run test --if-present

      - name: Verificar que la API arranca
        run: |
          npm start &
          PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "La API respondió en /health"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió en /health"
          kill $PID
          exit 1
